services:
  postgres:
    image: postgres:16-alpine
    container_name: docusync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docusync
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: docusync
    ports:
      # Loopback only: the credentials are well-known local defaults.
      # Set POSTGRES_HOST_PORT in .env if 5432 is taken by another server.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - docusync_pgdata:/var/lib/postgresql/data
      # Creates the least-privilege app role and the test database on first start.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docusync -d docusync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docusync_pgdata:
