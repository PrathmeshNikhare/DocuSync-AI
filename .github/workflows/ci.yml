name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Ephemeral CI database; the credentials are the documented local placeholders.
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: docusync
          POSTGRES_PASSWORD: change-me-local-only
          POSTGRES_DB: docusync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docusync -d docusync"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://docusync_app:change-me-app-local-only@localhost:5432/docusync_test
      TEST_MIGRATION_DATABASE_URL: postgres://docusync:change-me-local-only@localhost:5432/docusync_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Don't leave the token in .git/config while PR code (npm ci, build) runs.
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Create app role and test database
        env:
          PGPASSWORD: change-me-local-only
        run: psql -h localhost -U docusync -d docusync -v ON_ERROR_STOP=1 -f db/init/01-app-role.sql
      - name: Database tests
        run: npm run test:db
